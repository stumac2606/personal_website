name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v0.1.20
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-2.5-flash"
          # Explicitly pass the debug flag in the 'with' block
          gemini_debug: true 
          prompt: |
            Execute the 'Drive-to-Site Sync' routine defined in GEMINI.md:
            1. Use the 'sync-drive' skill to fetch new files from Google Drive 'Site_Updates'.
            2. Update content/media.ts and content/timeline.ts.
            3. Use the 'Telegram Messaging' skill to notify me of the results.
        env:
          # Also force the environment variable to be true
          GEMINI_DEBUG: true
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
