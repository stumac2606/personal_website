name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GEMINI_MODEL: "gemini-2.5-flash-lite"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create Gemini config directory
        run: mkdir -p ~/.gemini

      - name: Install dependencies
        run: |
          npm install

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v0.1.20
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-2.5-flash-lite"
          gemini_debug: false
          prompt: |
            Execute the 'Drive-to-Site Sync' routine from GEMINI.md:
            1. Fetch new files from Google Drive 'Site_Updates'.
            2. Update content/media.ts and content/timeline.ts.
            3. Notify me of the results:
               - If the 'Telegram Messaging' skill is available, use it.
               - Otherwise, use 'run_shell_command' to curl the Telegram Bot API:
                 curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                 -d chat_id="$TELEGRAM_CHAT_ID" \
                 -d text="Sync Complete: Updated site with new media."
        env:
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
