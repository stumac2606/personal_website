name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GEMINI_MODEL: "gemini-2.5-flash-lite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create Gemini config directory
        run: mkdir -p ~/.gemini

      - name: Install dependencies
        run: |
          npm install

      - name: Check for new Drive files (Efficient Step)
        id: check_files
        run: |
          # Use gws to list files directly in bash (Zero AI Cost)
          FILES=$(gws drive list --query "name contains 'Site_Updates'" --output json | jq -r '.[0].id' | xargs -I {} gws drive list --query "'{}' in parents" --output json)
          COUNT=$(echo "$FILES" | jq '. | length')
          echo "found_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "file_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}

      - name: Run Gemini Agent (Only if files exist)
        if: steps.check_files.outputs.found_count > 0
        uses: google-github-actions/run-gemini-cli@v0.1.20
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-2.5-flash-lite"
          gemini_debug: false
          prompt: |
            New media detected in Google Drive:
            ${{ steps.check_files.outputs.file_list }}

            1. Download these files using 'gws drive download'.
            2. Use your vision capabilities to analyze them and determine their categorization.
            3. Autonomously update the relevant data files (media.ts, timeline.ts, etc.) to integrate them.
            4. Notify me via Telegram ($TELEGRAM_CHAT_ID) that the sync is complete.
        env:
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: No updates found
        if: steps.check_files.outputs.found_count == 0
        run: echo "No new files found in Google Drive. Skipping AI sync to save quota."
