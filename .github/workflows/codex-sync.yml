name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Gemini Agent
        id: gemini_sync
        uses: google/gemini-action@v1
        with:
          model: "gemini-1.5-flash"
          instructions: |
            1. Fetch new files from Google Drive 'Site_Updates'.
            2. Categorize images and generate captions using Vision.
            3. Update content/media.ts and content/timeline.ts.
            4. Save processed assets to public/media/.
            5. If updates were made, send a summary via the 'Telegram Messaging' skill.
          auto_commit: true
          commit_message: "auto: AI Sync from Google Drive [skip ci]"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
