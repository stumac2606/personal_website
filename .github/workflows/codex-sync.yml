name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential: Allows the agent to push code changes
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Gemini Agent
        uses: google/gemini-action@v1
        with:
          model: "gemini-1.5-flash"
          instructions: |
            1. Fetch new files from Google Drive 'Site_Updates'.
            2. Use Vision to categorize images into 'Squash', 'Tech', 'Snowboard', 'Flight', or 'Life events'.
            3. Generate SEO-friendly titles and captions for each image based on visual content.
            4. Update content/media.ts and content/timeline.ts following existing TypeScript structures.
            5. Convert images to .webp and save to public/media/images/.
          # This automatically commits and pushes the changes back to your 'main' branch
          auto_commit: true 
          commit_message: "auto: AI Sync from Google Drive [skip ci]"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
