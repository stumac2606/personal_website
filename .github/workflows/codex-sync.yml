name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install -g @google/gws-cli 

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v0.1.20
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Switching to Flash-Lite for much higher 2026 free-tier limits
          gemini_model: "gemini-2.5-flash-lite" 
          # Disabling debug to prevent log overflow and save quota
          gemini_debug: false 
          prompt: |
            Execute the 'Drive-to-Site Sync' routine from GEMINI.md:
            1. Fetch new files from Google Drive 'Site_Updates' (including subfolders).
            2. Update content/media.ts and content/timeline.ts.
            3. Use the 'Telegram Messaging' skill to notify me of the results.
        env:
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
