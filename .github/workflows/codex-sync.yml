name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

      - name: Run Gemini Agent
        run: |
          npm install -g @google/gemini-cli
          # Creating the directory to avoid the ENOENT error seen in logs
          mkdir -p ~/.gemini
          gemini --model "gemini-2.5-flash-lite" --yolo -p "
            1. Activate the 'Telegram Messaging' skill.
            2. Activate the 'sync-drive' skill located at .agents/skills/sync-drive/SKILL.md.
            3. Execute the 'Drive-to-Site Sync' routine from GEMINI.md:
               - Fetch new files from Google Drive 'Site_Updates'.
               - Update content/media.ts and content/timeline.ts.
               - Send a Telegram notification with the summary.
          "
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash-lite"
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
