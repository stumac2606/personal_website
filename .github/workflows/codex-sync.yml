name: AI Content Sync (Gemini)
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM UTC
  workflow_dispatch:

jobs:
  gemini-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v0.1.20
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-1.5-flash" # Explicitly use the high-quota free model
          prompt: |
            Execute the 'Drive-to-Site Sync' routine from AGENTS.md:
            1. Use the 'sync-drive' skill to fetch new files from Google Drive 'Site_Updates' (including subfolders).
            2. Use folder names for event context and Gemini Vision for image/video captions.
            3. Update content/media.ts and content/timeline.ts with the new data.
            4. Convert assets to .webp and save to public/media/images/ or public/media/videos/.
            5. Use the 'Telegram Messaging' skill to send me a summary of exactly what was added.
        env:
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
